<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Day 03 — промптинг × reasoning</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <main>
    <p class="eyebrow">Day 03</p>
    <h1>Промптинг × рассуждение</h1>
    <p class="sub">
      6 задач × 4 способа × 2 режима reasoning.
      Модель: <code id="modelLabel">…</code>
    </p>

    <label>
      API key
      <input id="apiKey" type="password" autocomplete="off" placeholder="Вставьте ключ" />
    </label>

    <button id="run" type="button">Запустить эксперимент</button>
    <p id="status" class="status" hidden></p>
    <p id="error" class="error" hidden></p>

    <section id="tasksBox" class="panel" hidden>
      <h2>Задачи</h2>
      <ol id="tasksList"></ol>
    </section>

    <section id="summaryBox" class="panel" hidden>
      <h2>Таблица: способ × рассуждение</h2>
      <div class="table-wrap">
        <table id="summaryTable">
          <thead>
            <tr>
              <th>Способ</th>
              <th>Рассуждение</th>
              <th>Верных</th>
              <th>Токены</th>
              <th>Время, с</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="conclBox" class="panel" hidden>
      <h2>Выводы</h2>
      <ul id="conclusions"></ul>
    </section>

    <section id="detailsBox" class="panel" hidden>
      <h2>Детали по ячейкам</h2>
      <div id="details"></div>
    </section>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
